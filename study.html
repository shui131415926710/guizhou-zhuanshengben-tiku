<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>贵州专升本 · 刷题工作台（草稿纸 / 文章标注）</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#16202b; --ink-2:#4b5a68; --ink-3:#8a97a4;
    --line:#e3e7ec; --accent:#0f766e; --accent-soft:#e8f5f3; --warn:#9a6b17;
    --shadow:0 1px 2px rgba(16,32,43,.05), 0 8px 24px rgba(16,32,43,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit}

  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1400px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
  .brand h1{font-size:16px;margin:0;font-weight:650}
  .brand span{font-size:12px;color:var(--ink-3)}
  .tabs{display:flex;background:#eef1f4;border-radius:9px;padding:3px}
  .tabs button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer;font-weight:500}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,32,43,.1)}
  .switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;white-space:nowrap}
  .switch input{accent-color:var(--accent);width:15px;height:15px}

  .wrap{max-width:1400px;margin:0 auto;padding:18px 18px 90px;display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start}
  @media (max-width:900px){ .wrap{grid-template-columns:1fr} }
  .side{position:sticky;top:66px}
  @media (max-width:900px){ .side{position:static} }
  .side-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
  .side-title{font-size:12px;color:var(--ink-3);padding:7px 10px 5px}
  .paper-scroll{max-height:min(64vh,560px);overflow-y:auto}
  .paper-btn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:8px 9px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--ink-2)}
  .paper-btn:hover{background:#f4f6f8}
  .paper-btn.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
  .paper-btn .n{margin-left:auto;font-size:11px;color:var(--ink-3);background:#f0f3f5;padding:1px 7px;border-radius:20px}

  .paper-head{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:14px}
  .paper-head h2{margin:0 0 6px;font-size:19px;font-weight:650}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
  .meta b{color:var(--ink-2)}

  .toolbar{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer;font-weight:500}
  .btn:hover{border-color:#cfd6dd;background:#fbfcfd}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
  .ph-note{color:#9aa6b2;font-size:12px}
  .search{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;outline:none;background:#fff}
  .search:focus{border-color:#9ed3cb;box-shadow:0 0 0 3px rgba(15,118,110,.08)}

  .q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
  .qno{min-width:28px;height:24px;border-radius:7px;background:#eff3f6;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:650;padding:0 7px}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#f0f3f5;color:var(--ink-3)}
  .tag.choice{background:#eef4ff;color:#3b62a8}
  .score{margin-left:auto;font-size:12px;color:var(--ink-3)}
  .stem{margin:2px 0 8px;overflow-wrap:anywhere}
  .stem img,.passage img,.opt img,.ans img{max-width:100%;height:auto;vertical-align:middle}
  .stem p{margin:0}
  .stem .clear-both{display:none}

  .passage{position:relative;background:#fbfcfd;border:1px solid var(--line);border-left:3px solid #cfe3e0;border-radius:8px;padding:11px 15px 13px;margin:4px 0 10px;font-size:13.6px;color:var(--ink-2);overflow-wrap:anywhere}
  .passage p{margin:0}
  .passage .ph{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px;color:var(--ink-3)}
  .passage .ph b{color:var(--accent);font-weight:600}
  .passage .ph .btn{margin-left:auto}
  .passage.marking{border-color:#f0b8b8;background:#fffdf6;cursor:crosshair}
  .mark-layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;border-radius:8px}
  .passage.marking .mark-layer{pointer-events:auto}

  .opts{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px}
  .opt{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd;font-size:14px;cursor:pointer;transition:border-color .12s,background .12s}
  .opt:hover{border-color:#c9d6e3;background:#f7fafc}
  .opt.sel{border-color:#7aa7ff;background:#f1f7ff}
  .opt.sel .k{background:#3b62a8;border-color:#3b62a8;color:#fff}
  .ans-open .opt.wrong{border-color:#e0a2a2;background:#fdf2f2}
  .ans-open .opt.wrong .k{background:#c0392b;border-color:#c0392b;color:#fff}
  .opt .k{flex:0 0 20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:650;color:var(--ink-2)}
  .opt .v{flex:1;min-width:0;overflow-wrap:anywhere}
  .opt .v p{margin:0}
  .ans-open .opt.right{border-color:#9ed3cb;background:#f0faf8}
  .ans-open .opt.right .k{background:var(--accent);border-color:var(--accent);color:#fff}

  .ans{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none}
  .ans-open .ans{display:block}
  .ans-row{display:flex;gap:9px;align-items:flex-start;margin-bottom:5px;font-size:13.5px}
  .ans-row .lb{flex:0 0 auto;font-size:11.5px;color:#0d7a71;background:var(--accent-soft);padding:2px 8px;border-radius:20px;font-weight:600}
  .ans-row .val{flex:1;min-width:0;overflow-wrap:anywhere}
  .ans-row .val p{margin:0}
  .ana{font-size:13px;color:var(--ink-2);background:#fafbfc;border-radius:8px;padding:8px 11px;margin-top:7px;overflow-wrap:anywhere}
  .share{font-size:11.5px;color:var(--ink-3);margin-top:7px}

  /* ===== 草稿纸 ===== */
  .board{position:fixed;inset:0;z-index:60;
    background-color:#fdfdfa;
    background-image:radial-gradient(#e6e2d8 1px, transparent 1px);
    background-size:26px 26px;display:none}
  .board.on{display:block}
  #boardCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .board-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);z-index:5;max-width:calc(100vw - 24px);flex-wrap:wrap}
  .board-bar .grp{display:flex;align-items:center;gap:5px;padding:0 8px;border-right:1px solid var(--line)}
  .board-bar .grp:last-child{border-right:0}
  .sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:#16202b}
  .board-bar label{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
  .board-bar input[type=range]{width:80px}
  .board-bar .btn.on{background:var(--accent-soft);border-color:#bfe0da;color:#0c6459;font-weight:600}

  .qfloat{position:absolute;right:18px;top:16px;width:min(430px,46vw);background:rgba(255,255,255,.96);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;max-height:70vh}
  .qf-head{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);cursor:move;user-select:none;background:#fff;border-radius:12px 12px 0 0}
  .qf-head .t{font-size:12.5px;color:var(--ink-2);font-weight:600}
  .qf-head .grow{flex:1}
  .qf-body{padding:10px 12px;overflow:auto;font-size:13.5px}
  .qf-body img{max-width:100%}
  .qf-body p{margin:0}
  .qf-nav{display:flex;gap:6px;align-items:center;padding:6px 9px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
  .qf-nav .grow{flex:1}

  .hint{font-size:12px;color:var(--ink-3);margin:8px 0 0}

  /* ===== 文章精读 ===== */
  .reader{position:fixed;inset:0;z-index:70;background:#f7f8fa;display:none;flex-direction:column}
  .reader.on{display:flex}
  .rd-top{display:flex;align-items:center;gap:7px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .rd-top .t{font-size:13.5px;font-weight:600;color:var(--ink);margin-right:auto}
  .rd-top .grow{flex:1}
  .rd-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;min-height:0}
  @media (max-width:1000px){ .rd-main{grid-template-columns:1fr;grid-template-rows:1fr auto} }
  .rd-article-wrap{overflow:auto;padding:22px;min-height:0;background:#f7f8fa}
  .rd-article{position:relative;max-width:820px;margin:0 auto;background:#fffdf8;border:1px solid #e8e2d4;border-radius:10px;
    padding:22px 28px;font-size:16px;line-height:1.95;color:#1b232b;box-shadow:0 1px 3px rgba(16,32,43,.05);min-height:200px}
  .rd-article p{margin:0}
  .rd-article img{max-width:100%}
  .rd-article .mark-layer{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;pointer-events:auto;cursor:crosshair;touch-action:none}
  .rd-side{border-left:1px solid var(--line);background:#fff;overflow:auto;padding:14px 16px;min-height:0}
  @media (max-width:1000px){ .rd-side{border-left:0;border-top:1px solid var(--line);max-height:44vh} }
  .rd-side .qmini{border-bottom:1px dashed var(--line);padding:10px 0}
  .rd-side .qmini:last-child{border-bottom:0}
  .rd-side .qmini .hd{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--ink-3);margin-bottom:5px}
  .rd-side .qmini .hd .qno{background:#eff3f6;border-radius:6px;padding:1px 7px;color:var(--ink-2);font-weight:650;font-size:11.5px}
  .rd-side .qmini .hd .tg{font-size:12px;color:var(--ink-2);cursor:pointer;margin-left:auto;border:0;background:none;padding:0;text-decoration:underline}
  .rd-side .qmini .st{font-size:13.5px;color:var(--ink);margin-bottom:5px}
  .rd-side .qmini .ops{font-size:13px;color:var(--ink-2);line-height:1.8}
  .rd-side .qmini .ops span{display:block}
  .rd-side .qmini .ops span.ropt{padding:2px 5px;margin:1px 0;border-radius:5px;cursor:pointer}
  .rd-side .qmini .ops span.ropt:hover{background:#f3f7fb}
  .rd-side .qmini .ops span.ropt.sel{background:#eaf2ff;color:#2b4f92;font-weight:600}
  .rd-side .qmini .rb{display:none;margin-top:6px;font-size:12.5px;color:#0d7a71;background:var(--accent-soft);border-radius:7px;padding:6px 9px}
  .rd-side .qmini.open .rb{display:block}

  footer{max-width:1400px;margin:0 auto;padding:0 18px 40px;font-size:12px;color:var(--ink-3);line-height:1.8}
  .loading{color:var(--ink-3);font-size:13px;padding:22px 0}
</style>
</head>

<div class="topbar">
  <div class="topbar-in">

<script>
(function(){
  const META = window.APP_META;
  const Q = document.getElementById('questions');
  if(!META){ Q.textContent = '数据未加载：请确认 data-meta.js 与本页在同一目录。'; return; }
  const PAPERS = (window.PAPERS = window.PAPERS || {});

  let subject='math', category='real', currentId=null, paper=null;
  let showAll=false, keyword='';
  let curQ = 0;                       // 草稿纸浮窗当前题

  const elList=document.getElementById('paperList');
  const elHead=document.getElementById('paperHead');
  const elSearch=document.getElementById('search');
  const elSideTitle=document.getElementById('sideTitle');

  /* ---------- 本地存储 ---------- */
  const LS = {
    get(k, d){ try{ const v=localStorage.getItem('sb:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem('sb:'+k, JSON.stringify(v)); }catch(e){} }
  };

  /* ---------- 手写板内核 ---------- */
  function Board(canvas, opt){
    const ctx = canvas.getContext('2d');
    const st = {
      strokes: opt.strokes || [],          // [{c,w,pts:[[nx,ny]...]}] 归一化
      view: opt.view || {s:1, x:0, y:0},   // 画布视图（世界坐标变换）
      color: opt.color || '#1f2937',
      width: opt.width || 3,
      tool: 'pen',
      size: {w:0, h:0},
      dpr: Math.min(window.devicePixelRatio || 1, 2)
    };
    const api = { st: st, ctx: ctx, onChange: opt.onChange || function(){} };

    function resize(){
      const w = canvas.clientWidth || canvas.parentElement.clientWidth;
      const h = canvas.clientHeight || canvas.parentElement.clientHeight;
      st.size.w = w; st.size.h = h;
      canvas.width = Math.round(w * st.dpr);
      canvas.height = Math.round(h * st.dpr);
      ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
      redraw();
    }
    api.resize = resize;

    function applyView(){
      const v = st.view;
      ctx.setTransform(st.dpr*v.s, 0, 0, st.dpr*v.s, st.dpr*v.x, st.dpr*v.y);
    }
    function redraw(){
      const v = st.view;
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      applyView();
      st.strokes.forEach(s=>drawStroke(s, false));
      applyView();
    }
    api.redraw = redraw;

    function drawStroke(s, live){
      ctx.strokeStyle = s.c;
      ctx.lineWidth = s.w;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      if(s.erased) ctx.globalCompositeOperation = 'destination-out';
      else ctx.globalCompositeOperation = 'source-over';
      // 归一化坐标 → 当前视口像素
      const W = st.size.w, H = st.size.h;
      if(s.pts.length === 1){
        const x = s.pts[0][0]*W, y = s.pts[0][1]*H;
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.6, s.w/2), 0, Math.PI*2);
        ctx.fillStyle = s.c;
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        return;
      }
      for(let i=0;i<s.pts.length;i++){
        const x = s.pts[i][0]*W, y = s.pts[i][1]*H;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    // 屏幕坐标 → 归一化世界坐标
    function toNorm(cx, cy){
      const v = st.view;
      const x = (cx - v.x)/v.s, y = (cy - v.y)/v.s;
      return [x/st.size.w, y/st.size.h];
    }
    function pos(e){
      const r = canvas.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }

    let drawing=false, last=null, panning=false, panStart=null;

    canvas.addEventListener('pointerdown', e=>{
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      const [x,y] = pos(e);
      if(st.tool === 'pan'){ panning = true; panStart = {x, y, vx: st.view.x, vy: st.view.y}; return; }
      drawing = true;
      const s = {c: st.color, w: st.width, pts: [toNorm(x,y)], erased: st.tool==='eraser'};
      st.strokes.push(s);
      last = s;
      redraw();
    });

    canvas.addEventListener('pointermove', e=>{
      const [x,y] = pos(e);
      if(panning){ st.view.x = panStart.vx + (x - panStart.x); st.view.y = panStart.vy + (y - panStart.y); redraw(); return; }
      if(!drawing || !last) return;
      let evs = [];
      try{ evs = e.getCoalescedEvents ? e.getCoalescedEvents() : []; }catch(err){ evs = []; }
      if(!evs.length) evs = [e];
      const r2 = canvas.getBoundingClientRect();
      // 忽略重复点
      evs.forEach(ev=>{
        const nx = (ev.clientX - r2.left), ny = (ev.clientY - r2.top);
        if(e._lx === nx && e._ly === ny) return;
        last.pts.push(toNorm(nx, ny));
      });
      // 压感：有 pressure 时按力度调宽
      if(e.pressure && e.pointerType === 'pen'){
        last.w = Math.max(1, st.width * (0.45 + e.pressure * 1.1));
      }
      redraw();
    });

    function end(){
      if(drawing){ drawing = false; last = null; api.onChange(); }
      if(panning){ panning = false; }
    }
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);

    canvas.addEventListener('wheel', e=>{
      if(!e.ctrlKey && !e.metaKey && !opt.alwaysZoom) return;
      e.preventDefault();
      const [x,y] = pos(e);
      const old = st.view.s;
      const next = Math.min(4, Math.max(0.4, old * (e.deltaY < 0 ? 1.12 : 0.9)));
      st.view.x = x - (x - st.view.x) * (next/old);
      st.view.y = y - (y - st.view.y) * (next/old);
      st.view.s = next;
      redraw();
      if(api.onZoom) api.onZoom(next);
    }, {passive:false});

    api.undo = function(){ st.strokes.pop(); redraw(); api.onChange(); };
    api.clear = function(){ st.strokes.length = 0; redraw(); api.onChange(); };
    api.redraw = redraw;
    api.setTool = t=>{ st.tool = t; canvas.style.cursor = t==='pan'?'grab':(t==='eraser'?'cell':'crosshair'); };
    api.setColor = c=>{ st.color = c; };
    api.setWidth = w=>{ st.width = w; };
    api.exportPNG = function(){
      const tmp = document.createElement('canvas');
      tmp.width = canvas.width; tmp.height = canvas.height;
      const tc = tmp.getContext('2d');
      tc.fillStyle = getComputedStyle(canvas.parentElement).backgroundColor || '#fff';
      tc.fillRect(0,0,tmp.width,tmp.height);
      tc.drawImage(canvas,0,0);
      const a = document.createElement('a');
      a.download = (opt.name || 'board') + '.png';
      a.href = tmp.toDataURL('image/png');
      a.click();
    };
    resize();
    return api;
  }

  function matHash(m){
    const s = String(m || '').replace(/<[^>]*>/g,'').replace(/\s+/g,'').slice(0,140);
    let h = 5381;
    for(let i=0;i<s.length;i++) h = (((h<<5) + h) + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* ---------- 渲染 ---------- */
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // 选项正文：有图片/公式时原样输出；只有字母（正文印在题干图里）时给提示
  function optText(o){
    const raw = String(o.html || '');
    if(/<img|<svg|<math|katex/i.test(raw)) return raw;
    const plain = raw.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,'').replace(/\s/g,'').trim();
    if(!plain || plain === o.k) return '<span class="ph-note">见题干图</span>';

  }

    let c = 'opt';
    if(o.correct) c += ' right';
    if(pick === o.k) c += ' sel';
    if(pick === o.k && !o.correct) c += ' wrong';
    return c;
  }

    if(mode === 'reader'){
      let i = idx;
      if(!paper.questions[i] || !paper.questions[i].material){
        i = paper.questions.findIndex(x=>x.material);
      }
      if(i >= 0) setTimeout(()=>openReader(i), 300);
    } else if(mode === 'board'){
      setTimeout(()=>openBoard(idx), 300);
    }
  }

  function pickDefault(){
    const want = new URLSearchParams(location.search).get('paper');
    const l = papersOf(subject, category);
    if(want && l.some(p=>p.id===want)) return want;
    return l.length ? l[0].id : null;
  }

  document.querySelectorAll('#subjTabs button').forEach(b=>{
    b.onclick = ()=>{
      if(subject===b.dataset.subj) return;
      subject = b.dataset.subj;
      document.querySelectorAll('#subjTabs button').forEach(x=>x.classList.toggle('on', x===b));
      openPaper(pickDefault());
      document.getElementById('openBoard').textContent = subject==='math' ? '打开草稿纸' : '打开草稿纸（写笔记）';
    };
  });
  document.querySelectorAll('#catTabs button').forEach(b=>{
    b.onclick = ()=>{
      if(category===b.dataset.cat) return;
      category = b.dataset.cat;
      document.querySelectorAll('#catTabs button').forEach(x=>x.classList.toggle('on', x===b));
      openPaper(pickDefault());
    };
  });

  document.getElementById('allAns').onchange = e=>{
    showAll = e.target.checked;
    Q.querySelectorAll('.q').forEach(c=>c.classList.toggle('ans-open', showAll));
    Q.querySelectorAll('.toggle').forEach(b=>b.textContent = showAll?'隐藏答案':'查看答案');
  };
  document.getElementById('expandAll').onclick = ()=>{ document.getElementById('allAns').checked=true; document.getElementById('allAns').onchange({target:{checked:true}}); };
  document.getElementById('collapseAll').onclick = ()=>{ document.getElementById('allAns').checked=false; document.getElementById('allAns').onchange({target:{checked:false}}); };

  let timer=null;
  elSearch.oninput = e=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{
      keyword = e.target.value.trim();
      if(!paper) return;
      if(!keyword){ renderPaper(); return; }
      const hits = paper.questions.filter(q=>matches(q, keyword));
      Q.innerHTML = hits.length ? hits.map(q=>qCard(q, paper.questions.indexOf(q))).join('') : '<div class="loading">没有匹配的题目</div>';
      initMarks();
    }, 220);
  };

  window.addEventListener('resize', ()=>{
    markBoards && Q.querySelectorAll('.mark-layer').forEach(cv=>{ const b = markBoards.get(cv); b && b.resize(); });
    board && boardEl.classList.contains('on') && board.resize();
  });

  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){
      if(readerEl.classList.contains('on')){ closeReader(); return; }
      if(boardEl.classList.contains('on')){ closeBoard(); return; }
    }
    if(!boardEl.classList.contains('on')) return;
    if(e.key === 'z' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); board && board.undo(); }
  });

  // 支持 ?paper=eng-2024 直达：自动切到对应科目与类别
  (function initFromUrl(){
    const want = new URLSearchParams(location.search).get('paper');
    if(!want) return;
    const meta = (META.papers || []).find(p=>p.id === want);
    if(!meta) return;
    subject = meta.subject; category = meta.category;
    document.querySelectorAll('#subjTabs button').forEach(x=>x.classList.toggle('on', x.dataset.subj === subject));
    document.querySelectorAll('#catTabs button').forEach(x=>x.classList.toggle('on', x.dataset.cat === category));
  })();

  openPaper(pickDefault());
})();
</script>
